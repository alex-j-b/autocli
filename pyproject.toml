[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autocli"
version = "0.1.0"
description = "Factory for building per-site CLIs from recorded traffic"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alexis Boix" },
]
keywords = [
  "cli",
  "code-generation",
  "http",
  "mitmproxy",
  "traffic-capture",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "mitmproxy>=11,<12",
  "msgpack>=1,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "rich>=13.7,<14",
  "typer>=0.16,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
autocli = "autocli.cli:main"

[project.urls]
Homepage = "https://github.com/alex-j-b/autocli"
Repository = "https://github.com/alex-j-b/autocli"
Issues = "https://github.com/alex-j-b/autocli/issues"
Documentation = "https://github.com/alex-j-b/autocli#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocli = [
  "template_assets/runtime/*.j2",
  "template_assets/testing/*.j2",
  "template_assets/scaffold/*.j2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
